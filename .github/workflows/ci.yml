name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Architecture contracts
        run: lint-imports
      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing
      - name: Mutation check
        if: matrix.python == '3.11'
        run: python tools/mutation_check.py
      - name: Self-test
        run: python -m rietesd_demo --selftest
