[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rietesd-demo"
dynamic = ["version"]
description = "Corrects e.s.d.'s underestimated by serial correlation in Rietveld refinements; Durbin-Watson statistic and agreement factors."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Boris A. Levin" }, { name = "Aleksandr A. Levin" }]
keywords = ["Rietveld", "powder diffraction", "XRD", "crystallography", "e.s.d.", "Durbin-Watson"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "PySide6>=6.7",
  "PySide6-Fluent-Widgets>=1.8,<2",
  "pyqtgraph>=0.13",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
  "pillow>=10",
  "pre-commit>=3.7",
]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
rietesd-demo = "rietesd_demo.main:main"

[project.urls]
Repository = "https://github.com/bolevin/rietesd-demo"
Documentation = "https://github.com/bolevin/rietesd-demo/blob/main/docs/architecture.md"

[tool.hatch.version]
path = "src/rietesd_demo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rietesd_demo"]

# --- tests ------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error", "ignore::DeprecationWarning:qfluentwidgets.*", "ignore::DeprecationWarning:pyqtgraph.*"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["rietesd_demo"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

# --- lint and types ---------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PT", "RUF", "PL", "N"]
ignore = [
  "PLR2004",  # numbers in tests and physics are not "magic"
  "PLR0913",  # value objects take many fields
  "PLC0415",  # Qt is imported late on purpose: --selftest needs no display
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["PLR0915"]
"src/rietesd_demo/ui/main_window.py" = [
  "PLR0915",  # widget construction is long by nature
  "N802",     # Qt names its event handlers in camelCase
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyqtgraph.*", "qfluentwidgets.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# the widget base classes come from untyped libraries
module = ["rietesd_demo.ui.main_window", "rietesd_demo.ui.plot"]
disallow_subclassing_any = false

# --- architecture -----------------------------------------------------
[tool.importlinter]
root_package = "rietesd_demo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inwards: ui/adapters -> application -> domain"
type = "layers"
layers = [
  "rietesd_demo.main",
  "rietesd_demo.ui | rietesd_demo.adapters",
  "rietesd_demo.application",
  "rietesd_demo.domain",
]

[[tool.importlinter.contracts]]
name = "The calculation depends on the standard library only"
type = "forbidden"
source_modules = ["rietesd_demo.domain", "rietesd_demo.application"]
forbidden_modules = ["PySide6", "qfluentwidgets", "pyqtgraph", "numpy"]

[[tool.importlinter.contracts]]
name = "The presenter and the view contract are free of Qt"
type = "forbidden"
source_modules = ["rietesd_demo.ui.presenter", "rietesd_demo.ui.view"]
forbidden_modules = ["PySide6", "qfluentwidgets", "pyqtgraph"]
