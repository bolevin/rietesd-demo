repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-contracts
        name: architecture contracts
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
